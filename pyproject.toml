[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arcivo"
dynamic = ["version"]
description = "Arcivo — a local-first desktop archive manager for your Telegram Saved Messages (unofficial, uses the Telegram API)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
authors = [{ name = "Bitologist" }]
keywords = ["telegram-api", "saved-messages", "archive", "export", "desktop", "pyside6"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Natural Language :: Persian",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Archiving",
]
dependencies = [
  "telethon>=1.41,<2",
  "PySide6-Essentials>=6.10",
  "PySide6-Addons>=6.10",
  "keyring>=25",
  "platformdirs>=4",
  "python-socks[asyncio]>=2.4",
]

[project.optional-dependencies]
speedup = ["cryptg>=0.5"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pyinstaller>=6.16"]

[project.scripts]
arcivo = "arcivo.cli.main:main"

[project.gui-scripts]
arcivo-gui = "arcivo.gui.app:main"

[project.urls]
Homepage = "https://github.com/sadult/arcivo"
Issues = "https://github.com/sadult/arcivo/issues"

[tool.setuptools.dynamic]
version = { attr = "arcivo.__version__.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arcivo = ["db/migrations/*.sql", "i18n/locales/*.json", "assets/**/*", "export/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = ["gui: tests that need a Qt platform (run with QT_QPA_PLATFORM=offscreen)"]

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF012", "B008", "SIM105"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_ignores = true
