name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.2.1"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      ARCIVO_NO_ANIMATIONS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with: { python-version: "3.14", cache: pip }
      - name: Check tag matches version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}".TrimStart("v")
          $ver = (Select-String -Path src\arcivo\__version__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $ver) { throw "Tag v$tag does not match __version__ $ver" }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build (tests, PyInstaller, installer, portable ZIP, checksums)
        shell: pwsh
        run: ./scripts/build.ps1 -Python python -Build ${{ github.sha }}
      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.tag || github.ref_name }}".TrimStart("v")
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?s)## \[$([regex]::Escape($ver))\][^\n]*\n(.*?)(?=\n## \[|\z)")
          $body = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See CHANGELOG.md" }
          $body += "`n`n---`n**Downloads:** ``Arcivo-$ver-Setup-x64.exe`` (recommended, per-user installer) or ``Arcivo-$ver-portable-x64.zip``. Verify with ``SHA256SUMS.txt``.`n`nAfter installing, start **Arcivo** (console home screen: sign in, check connection, proxy) and then **Arcivo Dashboard** (the desktop app).`n`nArcivo is an independent app that uses the Telegram API; it is not affiliated with Telegram. You need your own API ID/hash from https://my.telegram.org/apps."
          Set-Content release-notes.md $body
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Arcivo ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-notes.md
          draft: true
          files: |
            dist/Arcivo-*-Setup-x64.exe
            dist/Arcivo-*-portable-x64.zip
            dist/SHA256SUMS.txt
