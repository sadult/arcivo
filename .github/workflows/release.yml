name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.2.1"
        required: true

permissions:
  contents: write

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      ARCIVO_NO_ANIMATIONS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with: { python-version: "3.14", cache: pip }
      - name: Check tag matches version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}".TrimStart("v")
          $ver = (Select-String -Path src\arcivo\__version__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          $baseTag = ($tag -split '-')[0]
          if ($baseTag -ne $ver) { throw "Tag v$tag (base $baseTag) does not match __version__ $ver" }
      - name: Build cryptg speedup (ARM64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          pip install setuptools-rust
          pip wheel --no-deps cryptg -w packaging/wheels
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            if (Get-Command choco -ErrorAction SilentlyContinue) {
              choco install innosetup -y --no-progress
            } elseif (Get-Command winget -ErrorAction SilentlyContinue) {
              winget install JRSoftware.InnoSetup --accept-source-agreements --accept-package-agreements
            } else {
              Invoke-WebRequest -Uri "https://files.jrsoftware.org/is/6/innosetup-6.3.3.exe" -OutFile "$env:TEMP\innosetup.exe"
              Start-Process -FilePath "$env:TEMP\innosetup.exe" -ArgumentList "/VERYSILENT", "/ALLUSERS", "/SUPPRESSMSGBOXES" -Wait
            }
          }
      - name: Build (tests, PyInstaller, installer, portable ZIP, checksums)
        shell: pwsh
        run: ./scripts/build.ps1 -Python python -Arch ${{ matrix.arch }} -Build ${{ github.sha }}
      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          $rawTag = "${{ github.event.inputs.tag || github.ref_name }}".TrimStart("v")
          $baseVer = ($rawTag -split '-')[0]
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?s)## \[$([regex]::Escape($baseVer))\][^\n]*\n(.*?)(?=\n## \[|\z)")
          $body = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See CHANGELOG.md" }
          $body += "`n`n---`n**Downloads:**`n* **x64:** ``Arcivo-$baseVer-Setup-x64.exe`` (installer) or ``Arcivo-$baseVer-portable-x64.zip```n* **ARM64:** ``Arcivo-$baseVer-Setup-arm64.exe`` (installer) or ``Arcivo-$baseVer-portable-arm64.zip```n`nVerify with ``SHA256SUMS.txt``.`n`nAfter installing, start **Arcivo** (console home screen: sign in, check connection, proxy) and then **Arcivo Dashboard** (the desktop app).`n`nArcivo is an independent app that uses the Telegram API; it is not affiliated with Telegram. You need your own API ID/hash from https://my.telegram.org/apps."
          Set-Content release-notes.md $body
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Arcivo ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-notes.md
          draft: true
          files: |
            dist/Arcivo-*-Setup-*.exe
            dist/Arcivo-*-portable-*.zip
            dist/SHA256SUMS.txt
