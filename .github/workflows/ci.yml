name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.14", cache: pip }
      - run: pip install ruff
      - run: ruff check src tests scripts tools
      - name: Translation catalogs are up to date
        run: |
          python tools/build_catalogs.py
          git diff --exit-code -- src/arcivo/i18n/locales

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.14"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      ARCIVO_NO_ANIMATIONS: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - name: Tests
        run: pytest --cov=arcivo --cov-report=xml --junitxml=junit.xml
      - name: CLI demo smoke test
        shell: bash
        run: |
          export ARCIVO_HOME="$RUNNER_TEMP/arcivo-demo"
          arcivo --demo sync
          arcivo --demo search "type:audio size:>10MB" --limit 5
          arcivo --demo stats
          arcivo --demo proxy show
          arcivo --demo status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python }}
          path: |
            junit.xml
            coverage.xml

  build-windows:
    needs: test
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'build')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.14", cache: pip }
      - name: Build app folder + portable ZIP (installer is built on release)
        shell: pwsh
        run: ./scripts/build.ps1 -Python python -SkipTests -SkipInstaller -Build ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: arcivo-windows-portable
          path: dist/*.zip
          retention-days: 14
