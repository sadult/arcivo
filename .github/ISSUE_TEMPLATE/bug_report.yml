name: Bug report
description: Something doesn't work as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Do not paste phone numbers, API hashes, session files or real message content.**
        If you can, reproduce the problem with `--demo` (synthetic data).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected and what happened instead.
      placeholder: "1. Open Storage → Duplicates\n2. Click …\n3. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Arcivo version
      description: "About page, or `arcivo version`"
      placeholder: "0.2.1 (build abc1234)"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run Arcivo?
      options: ["Installer (Setup.exe)", "Portable ZIP", "From source (pip)", "Other"]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
  - type: dropdown
    id: demo
    attributes:
      label: Does it also happen in demo mode?
      options: ["Yes", "No", "Didn't try"]
  - type: textarea
    id: logs
    attributes:
      label: Redacted log excerpt
      description: "Logs page → Export, or `arcivo logs --tail 200`. Secrets are masked automatically – please double-check anyway."
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal information (phone numbers, usernames, message content) from this report.
          required: true
